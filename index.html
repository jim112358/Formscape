<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formscape · 数学绘图空间</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><b>ƒ</b> Formscape <small>数学绘图空间</small></div><div><button id="save">导出项目</button><button id="load">导入</button><button id="png">导出图片 ↗</button><input type="file" id="file" accept="application/json" hidden></div></header><main><aside><div class="section">工作空间 <span>LOCAL</span></div><div class="tabs"><button id="two">二维平面</button><button id="three">三维空间</button></div><div class="row"><h2>表达式</h2><button id="add">＋ 添加</button></div><div id="cards"></div><section><div class="section">共享参数</div><label>a <input id="a" type="range" min="-3" max="3" step="0.01" value="1"><output id="av">1</output></label></section><section><div class="section">坐标轴与参数范围</div><div id="ranges"></div><p>X / Y / Z 控制坐标范围；勾选自动可适配结果。函数自变量自动时使用默认范围。t 用于曲线，u / v 用于参数曲面。各轴独立缩放。</p></section><footer>公式支持 sin、cos、sqrt、ln、π<br>滚轮缩放 · 拖动平移 / 旋转</footer></aside><article><div class="plot-title"><span id="title"></span><span class="live">● 实时预览</span></div><canvas id="plot"></canvas><div class="tools"><button id="reset">⌖ 重置视角</button><span id="status"></span></div></article></main><script type="module" src="app.js"></script></body></html>
